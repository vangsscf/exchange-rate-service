services:
  app:
    build:
      context: ./
    env_file: ./.env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - 3100:3100
    networks:
      - exchange-rate-service
  redis:
    image: redis
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - exchange-rate-service
networks:
  exchange-rate-service:
    driver: bridge
