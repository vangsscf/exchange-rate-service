services:
  app:
    build:
      context: ./
    env_file: ./.env
    depends_on:
      - redis
    ports:
      - 3100:3100
    networks:
      - exchange-rate-service
  redis:
    image: redis
    command: redis-server
    ports:
      - "6379:6379"
    networks:
      - exchange-rate-service
networks:
  exchange-rate-service:
    driver: bridge
